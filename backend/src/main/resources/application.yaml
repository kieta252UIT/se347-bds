spring:
  application:
    name: backend

server:
  port: ${PORT:8080}
  # Trust proxy: Tin cậy các header X-Forwarded-Proto, X-Forwarded-For từ Nginx Reverse Proxy
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
        path: /

supabase:
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  auth-connect-timeout-ms: ${SUPABASE_AUTH_CONNECT_TIMEOUT_MS:3000}
  auth-read-timeout-ms: ${SUPABASE_AUTH_READ_TIMEOUT_MS:10000}



