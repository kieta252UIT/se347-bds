worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Map nâng cấp kết nối WebSocket (hỗ trợ Vite HMR trên Frontend)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend_upstream {
        server 127.0.0.1:5173;
    }

    upstream backend_upstream {
        server 127.0.0.1:8080;
    }

    # Chuyển hướng toàn bộ HTTP (cổng 80) sang HTTPS (cổng 443)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Máy chủ HTTPS chính (Same-Origin cho cả React Frontend và Spring Boot API - ADR-0013, SDD-11)
    server {
        listen 443 ssl;
        server_name localhost;

        # Chứng chỉ SSL local (tạo bằng mkcert hoặc OpenSSL trong thư mục proxy/certs/)
        ssl_certificate     certs/localhost.pem;
        ssl_certificate_key certs/localhost-key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Giới hạn kích thước body phù hợp upload ảnh <= 10 MB/ảnh (BR-03, S1-29)
        client_max_body_size 15M;

        # Chuẩn hóa /api thành /api/
        location = /api {
            return 308 /api/;
        }

        # Định tuyến toàn bộ các request /api/* về Backend (Spring Boot cổng 8080)
        # Lưu ý: Toàn bộ API xác thực nằm dưới /api/auth/*, /api/csrf, /api/me.
        # Tuyệt đối KHÔNG proxy /auth/* về Backend vì /auth/verify-email và /auth/reset-password
        # là các route SPA của React Frontend nhận callback từ email.
        location /api/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;

            # Bảo toàn cookie và không lưu cache dùng chung cho dữ liệu API / Set-Cookie (ADR-0013, TS1-004)
            proxy_buffering    off;
            proxy_no_cache     1;
            proxy_cache_bypass 1;

            # Khi Backend tạm ngừng hoặc lỗi kết nối upstream, trả lỗi JSON chuẩn LoiApi thay vì HTML của Nginx
            proxy_intercept_errors on;
            error_page 502 503 504 =503 @api_upstream_unavailable;
        }

        location @api_upstream_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Vary "Cookie" always;
            return 503 '{"maLoi":"TAM_GIAN_DOAN","thongDiep":"Dịch vụ API tạm thời gián đoạn. Vui lòng thử lại sau.","truongLoi":[],"traceId":"proxy-upstream-503"}';
        }

        # Định tuyến toàn bộ giao diện (/) và SPA deep link (kể cả /auth/verify-email, /auth/reset-password)
        # về Frontend (Vite dev server cổng 5173)
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Hỗ trợ WebSocket cho Vite HMR
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}
