worker_processes auto;
events 
{
    worker_connections 1024;
}

http 
{
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Map nâng cấp kết nối WebSocket (hỗ trợ Vite HMR trên Frontend)
    map $http_upgrade $connection_upgrade 
    {
        default upgrade;
        ''      close;
    }

    upstream frontend_upstream 
    {
        server 127.0.0.1:5173;
    }

    upstream backend_upstream 
    {
        server 127.0.0.1:8080;
    }

    # Chuyển hướng toàn bộ HTTP (cổng 80) sang HTTPS (cổng 443)
    server 
    {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Máy chủ HTTPS chính (Same-Origin cho cả Frontend và Backend API)
    server 
    {
        listen 443 ssl;
        server_name localhost;

        # Chứng chỉ SSL (tạo bằng mkcert hoặc OpenSSL)
        ssl_certificate     certs/localhost.pem;
        ssl_certificate_key certs/localhost-key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Định tuyến các request /api/* về Backend (Spring Boot cổng 8080)
        location /api/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
        }

        # Định tuyến các request /auth/* về Backend
        location /auth/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
        }

        # Định tuyến toàn bộ giao diện (/) về Frontend (Vite cổng 5173)
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Hỗ trợ WebSocket cho Vite HMR
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}
